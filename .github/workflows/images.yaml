# Builds the openshell-tools image when it changes on main:
#   images/openshell-tools/VERSION = 0.1.6 -> ghcr.io/<owner>/openshell-tools:0.1.6
# VERSION tracks the bundled OpenShell release. For a scripts-only change, bump
# it with a suffix (0.1.6-1). A version that's already published is never
# overwritten, because deployed manifests reference it.
name: images

on:
  push:
    branches: [main]
    paths: [images/openshell-tools/**]
  workflow_dispatch:

jobs:
  openshell-tools:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          image="ghcr.io/${{ github.repository_owner }}/openshell-tools:$(cat images/openshell-tools/VERSION)"
          if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
            echo "::error::$image already exists. Bump images/openshell-tools/VERSION."
            exit 1
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: images/openshell-tools
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.image }}
