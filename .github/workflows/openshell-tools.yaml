# Builds the openshell-tools image, on demand:
#   Actions > Build openshell-tools image > Run workflow
#
# The tag must be the OpenShell version the image bundles (ARG OPENSHELL_VERSION
# in images/openshell-tools/Dockerfile), optionally with a -N suffix for a
# scripts-only rebuild of the same version:
#
#   0.1.6     the first build of OpenShell 0.1.6
#   0.1.6-1   the next build of the same version, then 0.1.6-2, ...
#
# A new tag must be the next one in that sequence. A published tag is only
# replaced when "overwrite" is checked.
#
# The Kargo verification Job pins the image by digest (setup/kargo/30_analysis-template.yaml),
# so update the digest there after each build.
name: Build openshell-tools image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag, e.g. 0.1.6 or 0.1.6-1
        required: true
        type: string
      overwrite:
        description: Replace the tag if it's already published
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - id: meta
        env:
          TAG: ${{ inputs.tag }}
          OVERWRITE: ${{ inputs.overwrite }}
          OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo="${OWNER,,}/openshell-tools"
          version=$(sed -n 's/^ARG OPENSHELL_VERSION=//p' images/openshell-tools/Dockerfile)
          version_re=${version//./\\.}

          if ! [[ "$TAG" =~ ^${version_re}(-[1-9][0-9]*)?$ ]]; then
            echo "::error::Tag $TAG doesn't match OpenShell $version. Use $version or $version-N."
            exit 1
          fi

          # Published tags. A package that doesn't exist yet has none.
          token=$(curl -sS -u "$ACTOR:$TOKEN" \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:$repo:pull" | jq -r '.token // empty')
          tags=""
          if [ -n "$token" ]; then
            tags=$(curl -sS -H "Authorization: Bearer $token" \
              "https://ghcr.io/v2/$repo/tags/list?n=1000" | jq -r '.tags // [] | .[]')
          fi

          if grep -qxF -- "$TAG" <<<"$tags"; then
            if [ "$OVERWRITE" != "true" ]; then
              echo "::error::ghcr.io/$repo:$TAG already exists. Check \"overwrite\" to replace it."
              exit 1
            fi
            echo "::warning::Replacing ghcr.io/$repo:$TAG. Nodes that already pulled it keep the old image."
          else
            # The next tag for this version: the bare version first, then -1, -2, ...
            last=-1
            while read -r t; do
              if [ "$t" = "$version" ]; then
                n=0
              elif [[ "$t" =~ ^${version_re}-([0-9]+)$ ]]; then
                n=${BASH_REMATCH[1]}
              else
                continue
              fi
              if [ "$n" -gt "$last" ]; then last=$n; fi
            done <<<"$tags"
            if [ "$last" -lt 0 ]; then expected=$version; else expected="$version-$((last + 1))"; fi
            if [ "$TAG" != "$expected" ]; then
              echo "::error::The next tag for OpenShell $version is $expected, not $TAG."
              exit 1
            fi
          fi

          echo "image=ghcr.io/$repo:$TAG" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: images/openshell-tools
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.image }}
