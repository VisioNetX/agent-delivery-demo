# Helm values for the OpenShell gateway chart (oci://ghcr.io/nvidia/openshell/helm-chart).
# Upstream reference: deploy/helm/openshell/values.yaml at the v0.1.6 tag.

agentSandbox:
  preflight:
    # The chart fails to render when the Agent Sandbox API isn't served yet.
    # Argo CD renders the chart before it applies the Agent Sandbox CRDs in the
    # same sync, so the first sync would always fail. Ordering is handled by
    # sync waves instead (see setup/cluster/agent-sandbox/kustomization.yaml).
    enabled: false

server:
  # Sandboxes run in the release namespace (openshell), the chart's default.
  # Their supervisor pods mount the openshell-client-tls Secret, which the chart
  # creates only there.

  auth:
    # DEMO ONLY. In Kubernetes, the chart's mTLS bundle secures the transport,
    # but user identity has to come from OIDC or a trusted access proxy. To keep
    # the demo self-contained, the gateway accepts unauthenticated callers, and
    # setup/cluster/openshell-setup/gateway-networkpolicy.yaml limits which
    # namespaces can reach it.
    # For production, configure server.oidc instead.
    allowUnauthenticatedUsers: true

  # Opt out of OpenShell's default usage telemetry.
  telemetryEnabled: false

  credentialStorage:
    # The key that encrypts provider credentials in the gateway's database.
    # Without this, the chart generates a random key on every render, since Argo
    # CD renders with `helm template`, where Helm's `lookup` can't find the
    # existing one. Each sync would then replace the key, and the gateway would
    # lose access to what it encrypted before. Created by hand; see the README's
    # setup.
    existingSecret: openshell-credential-encryption-key
