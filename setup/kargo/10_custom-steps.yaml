# Kargo Enterprise Custom Steps. On Akuity Platform they need Kargo v1.10+, the
# Promotion Controller and a self-hosted Kargo agent. They are cluster-scoped and run as
# containers in the promotion pod, in the same working directory as the
# built-in steps, so they can read the git-clone checkouts.
#
# Both use images/openshell-tools, pinned by digest: Kargo doesn't set a pull
# policy on Custom Step containers, so a node would keep running a cached copy
# of a rebuilt tag. Update the digest after rebuilding the image.
#
# Their config keys are the wrapper scripts' flags, which follow the openshell
# CLI's (`openshell sandbox create --name --from --policy --provider --upload
# --env`, `openshell-prover check --boundary`).
apiVersion: ee.kargo.akuity.io/v1alpha1
kind: CustomPromotionStep
metadata:
  name: openshell-policy-prove
spec:
  image: ghcr.io/akuity/openshell-tools:0.1.6@sha256:9a43a213fb628816901898574aacaec8700d25f3c57291701403db2ed0ea7ab7
  # Formal check, by an SMT (Satisfiability Modulo Theories) solver, that the
  # candidate policy grants nothing beyond the boundary. Exits non-zero on
  # anything but within_boundary, which fails the promotion before the stage
  # branch or the sandbox is touched.
  command:
    - openshell-policy-prove
    - --policy=${{ config.policy }}
    - --boundary=${{ config.boundary }}
  output:
    source:
      type: Pipe
      format: KeyValue
  defaultTimeout: 3m
  defaultErrorThreshold: 1
---
apiVersion: ee.kargo.akuity.io/v1alpha1
kind: CustomPromotionStep
metadata:
  name: openshell-sandbox-apply
spec:
  image: ghcr.io/akuity/openshell-tools:0.1.6@sha256:9a43a213fb628816901898574aacaec8700d25f3c57291701403db2ed0ea7ab7
  # Creates or updates the stage's sandbox through the OpenShell gateway. A
  # change to the image, the environment or the filesystem/process policy
  # recreates it; network rules and bundle files are updated in place.
  command:
    - openshell-sandbox-apply
    - --name=${{ config.name }}
    - --from=${{ config.from }}
    - --policy=${{ config.policy }}
    - --provider=${{ config.provider }}
    - --upload=${{ config.upload }}
    - --env=${{ config.env }}
    # The bundle is already exactly agent/, so skip OpenShell's .gitignore
    # filtering, which needs git (not in the image).
    - --no-git-ignore
  # Custom steps can't mount Secrets, so the gateway TLS bundle arrives through
  # config, from the openshell-gateway-tls credentials (see the README's setup).
  env:
    - name: OPENSHELL_TLS_CA_B64
      value: ${{ config.tls.ca }}
    - name: OPENSHELL_TLS_CERT_B64
      value: ${{ config.tls.cert }}
    - name: OPENSHELL_TLS_KEY_B64
      value: ${{ config.tls.key }}
  output:
    source:
      type: Pipe
      format: KeyValue
  defaultTimeout: 10m
  defaultErrorThreshold: 2
