# dev -> prod-us
#    \-> prod-eu
# dev is where versions are tried: its boundary allows any Orders API call, and
# its evals must pass before a version can go further. The two prod stages take
# the same Freight from dev but have different boundaries: prod-us allows
# refunds, prod-eu doesn't. Each stage has:
#   - its own sandbox (support-<stage>) on the OpenShell gateway
#   - its own boundary (boundaries/<stage>.yaml on main)
#   - its own Orders API (the ordersApiURL var). In this demo every stage uses
#     the same one; the host must also be allowed by the agent's policy.yaml
#     and the stage's boundary
#   - verification: the bundle's evals, run against the live sandbox
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: dev
  namespace: acme-support
spec:
  vars:
    - name: ordersApiURL
      value: http://orders-api.orders.svc.cluster.local
  requestedFreight:
    - origin:
        kind: Warehouse
        name: acme-support
      sources:
        direct: true
  promotionTemplate:
    spec:
      steps:
        - task:
            name: promote-agent
  verification:
    analysisTemplates:
      - name: agent-evals
    args:
      - name: sandbox
        value: support-dev
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod-us
  namespace: acme-support
spec:
  vars:
    - name: ordersApiURL
      value: http://orders-api.orders.svc.cluster.local
  requestedFreight:
    - origin:
        kind: Warehouse
        name: acme-support
      sources:
        stages: [dev]
  promotionTemplate:
    spec:
      steps:
        - task:
            name: promote-agent
  verification:
    analysisTemplates:
      - name: agent-evals
    args:
      - name: sandbox
        value: support-prod-us
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod-eu
  namespace: acme-support
spec:
  vars:
    - name: ordersApiURL
      value: http://orders-api.orders.svc.cluster.local
  requestedFreight:
    - origin:
        kind: Warehouse
        name: acme-support
      sources:
        stages: [dev]
  promotionTemplate:
    spec:
      steps:
        - task:
            name: promote-agent
  verification:
    analysisTemplates:
      - name: agent-evals
    args:
      - name: sandbox
        value: support-prod-eu
