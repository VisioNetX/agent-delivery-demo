# One piece of Freight per agent version in the walkthrough, each with an alias
# you can promote by name:
#
#   kargo promote --project acme-support --freight-alias v1-initial --stage dev
#
# Each pairs one commit of the support-agent-demo repo (the agent bundle) with
# the harness image. Kargo replaces metadata.name with an ID derived from the
# contents, and checks every artifact against the Warehouse's subscriptions, so
# apply this after the rest of setup/kargo/:
#
#   kargo apply -f setup/kargo/freight/
#
# The commit IDs and the image digest are filled in by the maintainers after
# creating the demo history (see "For maintainers" in support-agent-demo's
# README).
apiVersion: kargo.akuity.io/v1alpha1
kind: Freight
metadata:
  name: v1-initial
  namespace: acme-support
alias: v1-initial
origin:
  kind: Warehouse
  name: acme-support
commits:
  - repoURL: https://github.com/akuity/support-agent-demo.git
    branch: main
    id: 240b406103777456130c695b55edc932a7b6df7b
    message: Initial support agent
images:
  - repoURL: ghcr.io/akuity/support-agent-demo
    tag: 0.1.0
    digest: sha256:52e48d94f68a4482d1e7dbe9280af313c57e69053442b4b0823886a3fa0c5de9
---
