# How an agent version gets promoted to a stage, on open-source Kargo.
#
# Open-source Kargo has no Custom Steps, so the promotion only records what is
# being promoted. Proving and applying happen in the Stage's verification Job
# (see 30_analysis-template.yaml), which fails before touching the sandbox if
# the policy exceeds the boundary.
apiVersion: kargo.akuity.io/v1alpha1
kind: PromotionTask
metadata:
  name: promote-agent
  namespace: acme-support
spec:
  vars:
    - name: agentRepoURL
      value: https://github.com/akuity/support-agent-demo.git
    - name: imageRepo
      value: ghcr.io/akuity/support-agent-demo
  steps:
    - as: record
      uses: compose-output
      config:
        commit: ${{ commitFrom(vars.agentRepoURL).ID }}
        image: ${{ vars.imageRepo }}@${{ imageFrom(vars.imageRepo).Digest }}
