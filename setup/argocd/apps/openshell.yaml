# OpenShell runtime: the Agent Sandbox controller, then the OpenShell gateway.
# One Application with ordered sync waves, so the gateway never starts before
# the Sandbox API it depends on:
#   wave -2  agents namespace (setup/cluster/openshell)
#   wave -1  Agent Sandbox CRDs and controller (setup/cluster/agent-sandbox)
#   wave  0  OpenShell gateway Helm chart
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openshell
  namespace: argocd
spec:
  project: default
  destination:
    name: demo
    namespace: openshell
  sources:
    - repoURL: https://github.com/akuity/agent-delivery-demo.git
      targetRevision: main
      path: setup/cluster/agent-sandbox
    - repoURL: https://github.com/akuity/agent-delivery-demo.git
      targetRevision: main
      path: setup/cluster/openshell
      ref: values
    # Public OCI chart. Argo CD treats a repoURL without a scheme as OCI, so
    # no repository Secret is needed.
    - repoURL: ghcr.io/nvidia/openshell
      chart: helm-chart
      targetRevision: 0.1.6
      helm:
        releaseName: openshell
        valueFiles:
          - $values/setup/cluster/openshell/values.yaml
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The Agent Sandbox CRDs are too large for client-side apply's
      # last-applied annotation.
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
