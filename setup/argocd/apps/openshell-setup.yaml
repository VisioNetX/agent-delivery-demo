# Gateway-side configuration that OpenShell only exposes through its API:
# provider profiles and providers (the Anthropic credential). A PostSync Job
# applies it with the openshell CLI. Also holds the NetworkPolicy that limits
# who can reach the gateway.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openshell-setup
  namespace: argocd
spec:
  project: agent-delivery
  source:
    repoURL: https://github.com/VisioNetX/agent-delivery-demo.git
    targetRevision: local-oss-kargo
    path: setup/cluster/openshell-setup
  destination:
    name: demo
    namespace: openshell
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
