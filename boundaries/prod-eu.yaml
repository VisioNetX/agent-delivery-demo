# Boundary for the prod-eu stage: the MOST access any agent version may have in
# EU production. See dev.yaml for how boundaries are enforced.
#
# Prod EU: read-only access to orders. Refunds here still need a human, so an
# agent version that can issue refunds is blocked from this stage. Allowing it
# would take a reviewed change to this file (protect boundaries/ with
# CODEOWNERS), not just a new agent version. Compare prod-us.yaml.
version: 1

# Must match the agent policy path for path: the prover compares filesystem
# entries exactly and returns "unsupported" for nested or differing paths.
filesystem_policy:
  include_workdir: false
  read_only:
    - /usr
    - /lib
    - /lib64
    - /etc
    - /app
    - /proc
    - /dev/urandom
  read_write:
    - /sandbox
    - /tmp
    - /dev/null

landlock:
  compatibility: best_effort

network_policies:
  orders_api:
    endpoints:
      - host: orders-api.orders.svc.cluster.local
        port: 80
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: GET
              path: /customers/*/orders
          - allow:
              method: GET
              path: /orders/*
    binaries:
      - path: /usr/local/bin/python3.12
